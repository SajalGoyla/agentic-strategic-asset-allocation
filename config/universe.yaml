# 18-asset IPS universe (Ang, Azimbayev & Kim 2026, Section 4: 6 equity, 8 fixed income,
# REITs, gold, commodities, cash). The paper does not publish tickers: it uses Bloomberg
# index histories from Jan 1990 (e.g. SPTR Index for US Large Cap) and notes each class is
# investable through ETFs. Tickers below are our choice of the longest-lived, most liquid ETF
# proxy for each class.
#
# ticker           investable ETF proxy (Yahoo symbol)
# inception        ETF launch date; history before this needs a backfill
# backfill_ticker  long-history index mutual fund on Yahoo used to extend returns before
#                  ETF inception (stored unspliced; splicing is a historical-analysis decision)
# history_proxy    academic series that can extend history further (French library / FRED)
# cma_series       FRED series the asset-class agent needs for yield/valuation building blocks

assets:
  # ------------------------------------------------------------------ equity
  - id: us_large_cap
    name: US Large Cap
    group: equity
    ticker: SPY
    benchmark: "S&P 500 (paper uses Bloomberg SPTR Index)"
    inception: 1993-01-22
    backfill_ticker: VFINX
    history_proxy: "french:F-F_Research_Data_Factors Mkt-RF + RF (US total market, 1926-)"
    cma_series: [DGS10, DTB3]
    notes: Valuation inputs (CAPE, dividends, earnings) come from the Shiller dataset.

  - id: us_small_cap
    name: US Small Cap
    group: equity
    ticker: IWM
    benchmark: Russell 2000
    inception: 2000-05-22
    backfill_ticker: NAESX
    history_proxy: "french:6_Portfolios_2x3 mean of SMALL LoBM, ME1 BM2, SMALL HiBM"

  - id: us_value
    name: US Value
    group: equity
    ticker: IWD
    benchmark: Russell 1000 Value
    inception: 2000-05-22
    backfill_ticker: VIVAX
    history_proxy: "french:6_Portfolios_2x3 BIG HiBM"

  - id: us_growth
    name: US Growth
    group: equity
    ticker: IWF
    benchmark: Russell 1000 Growth
    inception: 2000-05-22
    backfill_ticker: VIGRX
    history_proxy: "french:6_Portfolios_2x3 BIG LoBM"

  - id: intl_developed
    name: International Developed
    group: equity
    ticker: EFA
    benchmark: MSCI EAFE
    inception: 2001-08-14
    history_proxy: "french:Developed_ex_US_3_Factors Mkt-RF + RF (USD, 1990-)"
    cma_series: [IRLTLT01DEM156N, IRLTLT01JPM156N, IRLTLT01GBM156N]

  - id: emerging_markets
    name: Emerging Markets
    group: equity
    ticker: EEM
    benchmark: MSCI Emerging Markets
    inception: 2003-04-07
    backfill_ticker: VEIEX
    history_proxy: "french:Emerging_5_Factors Mkt-RF + RF (USD, 1989-)"

  # ------------------------------------------------------------------ fixed income
  - id: short_treasuries
    name: Short-Term Treasuries
    group: fixed_income
    ticker: SHY
    benchmark: ICE US Treasury 1-3 Year
    inception: 2002-07-22
    backfill_ticker: VFISX
    history_proxy: "fred:DGS2 constant-maturity yield (synthetic duration-based returns, 1976-)"
    cma_series: [DGS1, DGS2, DGS3]

  - id: intermediate_treasuries
    name: Intermediate Treasuries
    group: fixed_income
    ticker: IEF
    benchmark: ICE US Treasury 7-10 Year
    inception: 2002-07-22
    backfill_ticker: VFITX
    history_proxy: "fred:DGS7/DGS10 constant-maturity yields (synthetic returns, 1962-)"
    cma_series: [DGS7, DGS10]

  - id: long_treasuries
    name: Long-Term Treasuries
    group: fixed_income
    ticker: TLT
    benchmark: ICE US Treasury 20+ Year
    inception: 2002-07-22
    backfill_ticker: VUSTX
    history_proxy: "fred:DGS20/DGS30 constant-maturity yields (synthetic returns, 1962-)"
    cma_series: [DGS20, DGS30]

  - id: ig_corporates
    name: Investment-Grade Corporates
    group: fixed_income
    ticker: LQD
    benchmark: iBoxx USD Liquid Investment Grade
    inception: 2002-07-22
    backfill_ticker: VWESX
    history_proxy: "fred:BAA/AAA Moody's yields (1919-)"
    cma_series: [BAMLC0A0CMEY, BAMLC0A0CM, BAA, AAA, BAA10Y]
    notes: VWESX is long-duration IG; adjust for duration mismatch before splicing.

  - id: hy_corporates
    name: High-Yield Corporates
    group: fixed_income
    ticker: HYG
    benchmark: iBoxx USD Liquid High Yield
    inception: 2007-04-04
    backfill_ticker: VWEHX
    cma_series: [BAMLH0A0HYM2EY, BAMLH0A0HYM2]
    notes: FRED keeps only ~3 years of ICE BofA HY data; use HYG distribution yield from the fund snapshot for longer context.

  - id: intl_sovereigns
    name: International Sovereign Bonds
    group: fixed_income
    ticker: BWX
    benchmark: Bloomberg Global Treasury ex-US Capped
    inception: 2007-10-02
    cma_series: [IRLTLT01DEM156N, IRLTLT01JPM156N, IRLTLT01GBM156N, IRLTLT01FRM156N, IRLTLT01CAM156N]

  - id: intl_corporates
    name: International Corporates
    group: fixed_income
    ticker: PICB
    benchmark: S&P International Corporate Bond
    inception: 2010-06-02
    cma_series: [IRLTLT01DEM156N, IRLTLT01GBM156N]
    notes: Shortest ETF history in the universe (limits the common sample to mid-2010). No free long-history yield series; rely on fund snapshot yield/duration.

  - id: usd_em_debt
    name: USD Emerging Market Debt
    group: fixed_income
    ticker: EMB
    benchmark: J.P. Morgan EMBI Global Core
    inception: 2007-12-17
    backfill_ticker: PREMX
    cma_series: [BAMLEMCBPIEY, DGS10]
    notes: PREMX is actively managed; BAMLEMCBPIEY is EM corporate (not sovereign) and limited to ~3 years on FRED.

  # ------------------------------------------------------------------ real assets and cash
  - id: reits
    name: REITs
    group: real_assets
    ticker: VNQ
    benchmark: MSCI US IMI Real Estate 25/50
    inception: 2004-09-23
    backfill_ticker: VGSIX
    cma_series: [DGS10, DFII10]

  - id: gold
    name: Gold
    group: real_assets
    ticker: GLD
    benchmark: LBMA Gold Price PM
    inception: 2004-11-18
    cma_series: [DFII10, T5YIFR, DTWEXBGS]
    notes: No free long gold history is ingested yet (FRED dropped LBMA prices); see docs/data_sources.md.

  - id: commodities
    name: Commodities
    group: real_assets
    ticker: DBC
    benchmark: DBIQ Optimum Yield Diversified Commodity
    inception: 2006-02-03
    cma_series: [DCOILWTICO, DCOILBRENTEU, PCOPPUSDM, DTB3]

  - id: cash
    name: Cash
    group: cash
    ticker: BIL
    benchmark: Bloomberg 1-3 Month US Treasury Bill
    inception: 2007-05-25
    history_proxy: "french:F-F_Research_Data_Factors RF / fred:DTB3"
    cma_series: [DTB3, DGS1MO, DFF]

reference_tickers: []
