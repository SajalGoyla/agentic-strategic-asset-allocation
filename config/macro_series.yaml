# FRED series for the macro agent and the CMA building blocks.
#
# The macro agent scores four dimensions -- growth, inflation, monetary policy and financial
# conditions -- and classifies the regime as expansion / late-cycle / recession / recovery
# (Ang, Azimbayev & Kim 2026, Section 3.2). The paper does not list series IDs; these are
# standard, long-history FRED indicators for each dimension.
#
# frequency         d/w/m/q/a, FRED native frequency (checked against FRED metadata in API mode)
# release_lag_days  days after period end until the value is public; used for point-in-time
#                   availability when vintages are not fetched
# vintages          fetch full ALFRED revision history (API-key mode) for revised series
# evaluation_only   ex-post labels (NBER dates) excluded from as-of queries

dimensions:
  growth: Real activity, labour market and recession-risk indicators
  inflation: Realised inflation and market / survey inflation expectations
  monetary_policy: Policy rate, balance sheet and yield-curve stance
  financial_conditions: Stress indices, credit spreads, equity volatility and the dollar
  rates_and_yields: Yield levels used as CMA building blocks for fixed income and cash
  commodities: Commodity prices for real-asset agents and supply-shock monitoring
  reference: Ex-post labels for evaluating regime classification (never model inputs)

series:
  # ------------------------------------------------------------------ growth
  - {id: GDPC1, name: Real GDP, dimension: growth, frequency: q, release_lag_days: 30, vintages: true}
  - {id: GDPNOW, name: Atlanta Fed GDPNow real GDP nowcast, dimension: growth, frequency: q, release_lag_days: 30, vintages: true, notes: keyless mode stores only the final nowcast (published ~1 month after quarter end); API vintages give the in-quarter path}
  - {id: INDPRO, name: Industrial production index, dimension: growth, frequency: m, release_lag_days: 17, vintages: true}
  - {id: CFNAI, name: Chicago Fed National Activity Index, dimension: growth, frequency: m, release_lag_days: 25, vintages: true}
  - {id: RSAFS, name: Advance retail sales, dimension: growth, frequency: m, release_lag_days: 16, vintages: true}
  - {id: PAYEMS, name: Nonfarm payrolls, dimension: growth, frequency: m, release_lag_days: 7, vintages: true}
  - {id: UNRATE, name: Unemployment rate, dimension: growth, frequency: m, release_lag_days: 7}
  - {id: ICSA, name: Initial jobless claims, dimension: growth, frequency: w, release_lag_days: 5}
  - {id: JTSJOL, name: JOLTS job openings, dimension: growth, frequency: m, release_lag_days: 40}
  - {id: SAHMREALTIME, name: Real-time Sahm rule recession indicator, dimension: growth, frequency: m, release_lag_days: 7}
  - {id: UMCSENT, name: University of Michigan consumer sentiment, dimension: growth, frequency: m, release_lag_days: 30}
  - {id: RECPROUSM156N, name: Smoothed US recession probabilities (Chauvet-Piger), dimension: growth, frequency: m, release_lag_days: 60}

  # ------------------------------------------------------------------ inflation
  - {id: CPIAUCSL, name: CPI all items, dimension: inflation, frequency: m, release_lag_days: 13}
  - {id: CPILFESL, name: Core CPI, dimension: inflation, frequency: m, release_lag_days: 13}
  - {id: PCEPI, name: PCE price index, dimension: inflation, frequency: m, release_lag_days: 30, vintages: true}
  - {id: PCEPILFE, name: Core PCE price index, dimension: inflation, frequency: m, release_lag_days: 30, vintages: true}
  - {id: T5YIE, name: 5-year breakeven inflation, dimension: inflation, frequency: d, release_lag_days: 1}
  - {id: T10YIE, name: 10-year breakeven inflation, dimension: inflation, frequency: d, release_lag_days: 1}
  - {id: T5YIFR, name: 5-year 5-year forward inflation expectation, dimension: inflation, frequency: d, release_lag_days: 1}
  - {id: MICH, name: University of Michigan 1-year inflation expectations, dimension: inflation, frequency: m, release_lag_days: 30}
  - {id: EXPINF10YR, name: Cleveland Fed 10-year expected inflation, dimension: inflation, frequency: m, release_lag_days: 15}

  # ------------------------------------------------------------------ monetary policy
  - {id: DFF, name: Effective federal funds rate, dimension: monetary_policy, frequency: d, release_lag_days: 1}
  - {id: FEDFUNDS, name: Effective federal funds rate (monthly), dimension: monetary_policy, frequency: m, release_lag_days: 1}
  - {id: DFEDTARU, name: Federal funds target range upper limit, dimension: monetary_policy, frequency: d, release_lag_days: 1}
  - {id: DTB3, name: 3-month Treasury bill (secondary market), dimension: monetary_policy, frequency: d, release_lag_days: 1}
  - {id: DGS2, name: 2-year Treasury constant maturity, dimension: monetary_policy, frequency: d, release_lag_days: 1}
  - {id: T10Y2Y, name: 10-year minus 2-year Treasury spread, dimension: monetary_policy, frequency: d, release_lag_days: 1}
  - {id: T10Y3M, name: 10-year minus 3-month Treasury spread, dimension: monetary_policy, frequency: d, release_lag_days: 1}
  - {id: DFII10, name: 10-year TIPS real yield, dimension: monetary_policy, frequency: d, release_lag_days: 1}
  - {id: WALCL, name: Federal Reserve total assets, dimension: monetary_policy, frequency: w, release_lag_days: 2}

  # ------------------------------------------------------------------ financial conditions
  - {id: NFCI, name: Chicago Fed National Financial Conditions Index, dimension: financial_conditions, frequency: w, release_lag_days: 5}
  - {id: STLFSI4, name: St. Louis Fed Financial Stress Index, dimension: financial_conditions, frequency: w, release_lag_days: 7}
  - {id: VIXCLS, name: CBOE VIX, dimension: financial_conditions, frequency: d, release_lag_days: 1}
  - {id: BAA10Y, name: Moody's Baa minus 10-year Treasury spread, dimension: financial_conditions, frequency: d, release_lag_days: 1}
  - {id: BAMLH0A0HYM2, name: ICE BofA US high yield OAS, dimension: financial_conditions, frequency: d, release_lag_days: 1, notes: FRED licence limits ICE BofA data to a rolling ~3 years}
  - {id: BAMLC0A0CM, name: ICE BofA US corporate (IG) OAS, dimension: financial_conditions, frequency: d, release_lag_days: 1, notes: FRED licence limits ICE BofA data to a rolling ~3 years}
  - {id: DTWEXBGS, name: Nominal broad US dollar index, dimension: financial_conditions, frequency: d, release_lag_days: 7}

  # ------------------------------------------------------------------ rates and yields (CMA building blocks)
  - {id: DGS1MO, name: 1-month Treasury constant maturity, dimension: rates_and_yields, frequency: d, release_lag_days: 1}
  - {id: DGS3MO, name: 3-month Treasury constant maturity, dimension: rates_and_yields, frequency: d, release_lag_days: 1}
  - {id: DGS1, name: 1-year Treasury constant maturity, dimension: rates_and_yields, frequency: d, release_lag_days: 1}
  - {id: DGS3, name: 3-year Treasury constant maturity, dimension: rates_and_yields, frequency: d, release_lag_days: 1}
  - {id: DGS5, name: 5-year Treasury constant maturity, dimension: rates_and_yields, frequency: d, release_lag_days: 1}
  - {id: DGS7, name: 7-year Treasury constant maturity, dimension: rates_and_yields, frequency: d, release_lag_days: 1}
  - {id: DGS10, name: 10-year Treasury constant maturity, dimension: rates_and_yields, frequency: d, release_lag_days: 1}
  - {id: DGS20, name: 20-year Treasury constant maturity, dimension: rates_and_yields, frequency: d, release_lag_days: 1}
  - {id: DGS30, name: 30-year Treasury constant maturity, dimension: rates_and_yields, frequency: d, release_lag_days: 1}
  - {id: DFII5, name: 5-year TIPS real yield, dimension: rates_and_yields, frequency: d, release_lag_days: 1}
  - {id: THREEFYTP10, name: Kim-Wright 10-year term premium, dimension: rates_and_yields, frequency: d, release_lag_days: 7}
  - {id: AAA, name: Moody's seasoned Aaa corporate yield, dimension: rates_and_yields, frequency: m, release_lag_days: 1}
  - {id: BAA, name: Moody's seasoned Baa corporate yield, dimension: rates_and_yields, frequency: m, release_lag_days: 1}
  - {id: BAMLC0A0CMEY, name: ICE BofA US corporate (IG) effective yield, dimension: rates_and_yields, frequency: d, release_lag_days: 1, notes: rolling ~3 years on FRED}
  - {id: BAMLH0A0HYM2EY, name: ICE BofA US high yield effective yield, dimension: rates_and_yields, frequency: d, release_lag_days: 1, notes: rolling ~3 years on FRED}
  - {id: BAMLEMCBPIEY, name: ICE BofA emerging markets corporate plus effective yield, dimension: rates_and_yields, frequency: d, release_lag_days: 1, notes: rolling ~3 years on FRED}
  - {id: IRLTLT01DEM156N, name: Germany 10-year government yield (OECD), dimension: rates_and_yields, frequency: m, release_lag_days: 45}
  - {id: IRLTLT01JPM156N, name: Japan 10-year government yield (OECD), dimension: rates_and_yields, frequency: m, release_lag_days: 45}
  - {id: IRLTLT01GBM156N, name: UK 10-year government yield (OECD), dimension: rates_and_yields, frequency: m, release_lag_days: 45}
  - {id: IRLTLT01FRM156N, name: France 10-year government yield (OECD), dimension: rates_and_yields, frequency: m, release_lag_days: 45}
  - {id: IRLTLT01CAM156N, name: Canada 10-year government yield (OECD), dimension: rates_and_yields, frequency: m, release_lag_days: 45}

  # ------------------------------------------------------------------ commodities
  - {id: DCOILWTICO, name: WTI crude oil spot, dimension: commodities, frequency: d, release_lag_days: 7}
  - {id: DCOILBRENTEU, name: Brent crude oil spot, dimension: commodities, frequency: d, release_lag_days: 7}
  - {id: PCOPPUSDM, name: Global copper price (IMF), dimension: commodities, frequency: m, release_lag_days: 45}

  # ------------------------------------------------------------------ reference (evaluation only)
  - {id: USREC, name: NBER recession indicator, dimension: reference, frequency: m, release_lag_days: 365, evaluation_only: true}
