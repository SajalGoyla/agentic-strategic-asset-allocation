# Investment Policy Statement (IPS) v0.2 -- the governing document of the pipeline.
#
# Ang, Azimbayev & Kim (2026) §3.1 and §5.2: the IPS is written by humans and encodes the
# institution's objectives and constraints; every agent reads it, the CRO agent checks
# compliance for every candidate portfolio, and the CIO agent is bound by it. This file is the
# machine-readable form; docs/ips.md is the narrative form a board would read.
#
# Provenance of every number below:
#   [paper]     stated in Ang et al. §4 (or Exhibit 8 for the CMA horizon)
#   [faculty]   answered by Prof. Glasserman, 2026-09-25 -- the paper does not publish it
#   [proposed]  still ours, not yet put to faculty
#
# `status` stays `draft` until faculty explicitly ratify the document as a whole. Answering
# individual questions is not the same as signing it off, and every agent records which
# version and status it ran under.
#
# Severities: `hard` violations disqualify the portfolio the CIO recommends (§3.6: IPS
# compliance is non-negotiable for the CIO). Candidate portfolios from the PC agents are not
# disqualified: the CRO reports their violations and compliance is scored in the vote and by
# the CIO, as in the paper (decision 32). `soft` violations are recorded and surfaced in the
# board memo but never disqualify. Structural rules (universe membership, long-only, leverage,
# weights summing to 1) are always hard and carry no severity field.

version: 0.2
status: draft # draft | ratified
ratified_by: null
ratified_on: null

# --------------------------------------------------------------------- layer 1: universe
universe:
  # The 18 permissible asset classes live in config/universe.yaml and are not duplicated here.
  source: config/universe.yaml

  permitted: # [faculty] "I agree with no leverage, no shorting."
    long_only: true
    leverage: false
    derivatives: false

  # [faculty] No weight limits, per asset or per group: "Since the assets are really asset
  # classes, I'm not sure we need weight limits -- why rule out the possibility of going all in
  # on one asset class."
  #
  # The binding constraints are therefore the volatility band, the drawdown limit and the
  # tracking-error budget below. This also suits the deliberation protocol (§3.5), which
  # assumes the PC agents produce genuinely different portfolios to review and vote on --
  # bounds tight enough to feel safe would collapse them onto one another.
  bounds: null

# -------------------------------------------------------------------- layer 2: objectives
objectives:
  # [paper] "a target real return of CPI + 3.0-4.0%"
  # [faculty] hard. Asked how strictly the pipeline should adhere to the IPS limits, the answer
  # was "treat them as hard constraints", so every limit in this document binds, this one
  # included. Note the consequence: a portfolio forecast to earn MORE than CPI + 4% is
  # disqualified as surely as one forecast to earn less, which is worth confirming.
  return:
    type: real_cpi_plus
    min_pct: 3.0
    max_pct: 4.0
    inflation_series: CPIAUCSL
    severity: hard

  # [paper] "an expected volatility band of 8-12%"
  # [faculty] hard, on both sides. The §4.4 portfolio's 7.54% reads as "bad rounding" rather
  # than as licence to relax the band.
  volatility:
    min_pct: 8.0
    max_pct: 12.0
    severity: hard

  # [paper] "a maximum drawdown limit of -25% peak-to-trough"
  # [faculty] hard. Likewise the §4.4 backtest's -25.6%.
  max_drawdown:
    limit_pct: -25.0
    severity: hard

  # [paper] Exhibit 8 reports CMAs as "%, nominal, 3-year horizon".
  cma_horizon_years: 3

# ------------------------------------------------------------------ layer 3: active risk
active_risk:
  # [paper] "the portfolio's ex-ante tracking error relative to the 60/40 equity-bond
  # benchmark must not exceed 6%". The paper does not say what sits on either side of the
  # 60/40.
  #
  # [faculty] "Agreed on the equity component. For the bonds I would use 75% Intermediate
  # Treasuries and 25% IG Corporates." So the 40% splits 30/10 across the two.
  #
  # All three legs are drawn from the 18-asset universe, so tracking error is computed from
  # the same covariance matrix the PC agents already use, and all three have return history
  # from 1980 (docs/asset_data_map.md) -- comfortably covering the paper's 1996-2026 backtest.
  benchmark:
    id: benchmark_60_40
    name: 60/40 equity-bond benchmark
    weights:
      us_large_cap: 0.60
      intermediate_treasuries: 0.30
      ig_corporates: 0.10
    rebalance: quarterly

  tracking_error:
    max_ex_ante_pct: 6.0
    severity: hard

# ------------------------------------------------------------- governance and operations
# [paper] §3.6: the board memo covers "a quarterly rebalancing plan with off-cycle drift
# triggers".
# [faculty] "Let's skip the drift triggers and just go with quarterly rebalancing. (Otherwise,
# we would need to specify what happens if the trigger is breached -- e.g., go to cash.)"
rebalancing:
  cadence: quarterly
  drift_trigger_pct: null

# [paper] §5.2: the IPS sets "escalation triggers"; adjusting them moves the system between
# autonomy levels. The specific triggers are ours.
escalation:
  - condition: hard_violation_unresolved
    action: escalate_to_human
    note: No candidate portfolio clears every hard IPS rule after the revision cycle.
  - condition: regime_confidence_below
    threshold: 0.40
    action: flag_in_board_memo
    note: Macro agent's regime confidence is low; downstream CMAs inherit that uncertainty.
  - condition: cio_selects_below_composite
    threshold: 0.30
    action: flag_in_board_memo
    note: CIO's chosen ensemble scores poorly on the composite metric; require a rationale.
